# Sveltia CMS 설정 — 우주의 각 자리로 글이 흘러가는 지도.
# 저장 = main 브랜치 커밋 = Vercel 자동 배포(1~2분 뒤 우주에 반영).

backend:
  name: github
  repo: wonchance-art/link
  branch: main
  base_url: https://link-fnup.vercel.app
  auth_endpoint: api/auth

media_folder: static/media
public_folder: /media

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: records
    label: 기록 — 토성의 서가
    label_singular: 기록
    folder: src/content/records
    create: true
    slug: '{{fields.moon}}-{{slug}}'
    summary: '{{fields.moon}} · {{fields.date}} · {{fields.title}}'
    fields:
      - name: moon
        label: 위성(주제)
        widget: select
        options:
          - { value: mimas, label: 'Mimas · 흔적' }
          - { value: enceladus, label: 'Enceladus · 샘' }
          - { value: tethys, label: 'Tethys · 흐름' }
          - { value: dione, label: 'Dione · 곁' }
          - { value: rhea, label: 'Rhea · 품' }
          - { value: titan, label: 'Titan · 심연' }
          - { value: iapetus, label: 'Iapetus · 양면' }
      - { name: date, label: 날짜, widget: string, required: false, hint: "'2026.07' 같은 자유 형식" }
      - { name: title, label: 제목, widget: string, required: false }
      - { name: body, label: 본문, widget: markdown }

  - name: principles
    label: 원칙 — 목성의 법전
    label_singular: 원칙
    folder: src/content/principles
    create: true
    slug: '{{fields.moon}}-{{slug}}'
    summary: '{{fields.moon}} · {{fields.title}}'
    fields:
      - name: moon
        label: 위성(원칙)
        widget: select
        options:
          - { value: io, label: 'Io · 불' }
          - { value: europa, label: 'Europa · 침묵' }
          - { value: ganymede, label: 'Ganymede · 자립' }
          - { value: callisto, label: 'Callisto · 견딤' }
      - { name: date, label: 날짜, widget: string, required: false }
      - { name: title, label: 제목, widget: string, required: false }
      - { name: body, label: 본문, widget: markdown }

  - name: sea
    label: 바다 — 흘러든 문장
    files:
      - name: inflows
        label: 흘러든 문장들
        file: src/content/inflows.json
        fields:
          - name: items
            label: 문장
            widget: list
            fields:
              - { name: text, label: 문장, widget: text }
              - { name: source, label: 출처, widget: string, required: false, hint: '사람·책·노래 등' }
              - { name: date, label: 날짜, widget: string, required: false }

  - name: galaxy
    label: 은하 — 감사의 별
    files:
      - name: gratitude
        label: 감사의 별들
        file: src/content/gratitude.json
        fields:
          - name: items
            label: 별
            widget: list
            fields:
              - { name: id, label: id, widget: string, hint: '영문 소문자-하이픈' }
              - { name: name, label: 이름, widget: string }
              - { name: note, label: 한 줄, widget: text }
              - { name: x, label: 'x (%)', widget: number, value_type: float, min: 0, max: 100 }
              - { name: y, label: 'y (%)', widget: number, value_type: float, min: 0, max: 100 }

  - name: grove
    label: 풀숲 — Wonnit 작업
    files:
      - name: works
        label: 작업 목록
        file: src/content/works.json
        fields:
          - name: ko
            label: 한국어
            widget: list
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: description, label: 설명, widget: string, required: false }
              - { name: date, label: 날짜, widget: string, required: false }
              - { name: href, label: 링크, widget: string, required: false }
          - name: en
            label: English
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: date, label: Date, widget: string, required: false }
              - { name: href, label: Link, widget: string, required: false }
